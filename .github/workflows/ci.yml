name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SERPAPI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Prepare test database
        run: RAILS_ENV=test bin/rails db:prepare

      - name: Run tests
        run: bin/rails test

      - name: Run RuboCop
        run: bundle exec rubocop
